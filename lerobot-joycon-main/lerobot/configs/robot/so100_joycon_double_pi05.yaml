# SO-100 bimanual collection configuration for PI0.5 datasets.

_target_: lerobot.common.robot_devices.robots.manipulator.ManipulatorRobot
robot_type: so100
calibration_dir: .cache/calibration/so100
max_relative_target: null

controllers:
  left:
    _target_: lerobot.common.robot_devices.controllers.joycon_controller.JoyConController
    name: left
    initial_position: [0.0, -3.14, 3.14, 0.0, 1.57, -0.157]
  right:
    _target_: lerobot.common.robot_devices.controllers.joycon_controller.JoyConController
    name: right
    initial_position: [0.0, -3.14, 3.14, 0.0, 1.57, -0.157]

follower_arms:
  right:
    _target_: lerobot.common.robot_devices.motors.feetech.FeetechMotorsBus
    port: /dev/lerobot_right
    motors:
      shoulder_pan: [1, "sts3215"]
      shoulder_lift: [2, "sts3215"]
      elbow_flex: [3, "sts3215"]
      wrist_flex: [4, "sts3215"]
      wrist_roll: [5, "sts3215"]
      gripper: [6, "sts3215"]
  left:
    _target_: lerobot.common.robot_devices.motors.feetech.FeetechMotorsBus
    port: /dev/lerobot_left
    motors:
      shoulder_pan: [1, "sts3215"]
      shoulder_lift: [2, "sts3215"]
      elbow_flex: [3, "sts3215"]
      wrist_flex: [4, "sts3215"]
      wrist_roll: [5, "sts3215"]
      gripper: [6, "sts3215"]

cameras:
  left_wrist:
    _target_: lerobot.common.robot_devices.cameras.opencv.OpenCVCamera
    camera_index: 2
    fps: 30
    width: 640
    height: 480
  right_wrist:
    _target_: lerobot.common.robot_devices.cameras.opencv.OpenCVCamera
    camera_index: 4
    fps: 30
    width: 640
    height: 480
